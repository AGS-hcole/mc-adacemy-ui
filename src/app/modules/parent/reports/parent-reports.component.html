<div class="absolute inset-0 flex min-w-0 flex-col overflow-y-auto">
    <!-- Child Selector (multiple children only) -->
    <div
        *ngIf="children.length > 1"
        class="bg-card flex-0 px-4 py-3 shadow-sm sm:px-6"
    >
        <div class="flex items-center gap-3">
            <mat-icon
                class="text-secondary icon-size-5"
                svgIcon="heroicons_outline:user"
            ></mat-icon>
            <div class="flex flex-wrap gap-2">
                <button
                    *ngFor="let child of children"
                    type="button"
                    (click)="onChildChange(child)"
                    [class.bg-primary]="childId === child.id"
                    [class.text-white]="childId === child.id"
                    class="rounded-full border px-4 py-1 text-sm font-medium transition-colors"
                    [class.border-primary]="childId === child.id"
                    [class.border-gray-300]="childId !== child.id"
                >
                    {{ child.displayName }}
                </button>
            </div>
        </div>
    </div>

    <!-- Reports dashboard for the selected child -->
    <div class="relative flex-auto">
        <reports-dashboard
            *ngIf="childId"
            [lockedUserId]="childId"
        ></reports-dashboard>
        <div
            *ngIf="!childId && !loading"
            class="flex flex-auto items-center justify-center p-12 text-secondary"
        >
            {{ 'PARENT.REPORTS.NO_CHILD' | transloco }}
        </div>
    </div>
</div>
